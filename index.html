<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abiotic Factor Recipe Tree</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --warn: #d29922;
      --purple: #d2a8ff;
      --red: #f85149;
      --hover: #21262d;
      --line: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
    header h1 span { color: var(--accent); }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 480px; }
    #search {
      width: 100%;
      padding: 9px 12px;
      font-size: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.2); }
    #suggestions {
      position: absolute; left: 0; right: 0; top: 100%;
      margin-top: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    #suggestions.show { display: block; }
    .sug-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover, .sug-item.active { background: var(--hover); }
    .sug-item img, .ii {
      width: 28px; height: 28px; object-fit: contain;
      background: #000; border-radius: 4px; flex-shrink: 0;
    }
    .sug-item .cat { font-size: .72rem; color: var(--muted); margin-left: auto; }
    .hint { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar button {
      background: var(--hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: .85rem;
    }
    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar button:disabled { opacity: .4; cursor: default; border-color: var(--border); color: var(--muted); }

    main { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .status { color: var(--muted); font-size: .88rem; margin-bottom: 12px; }

    .tree-root {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px 12px 4px;
      overflow-x: auto;
    }
    .node { position: relative; margin: 2px 0; }
    .node-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 6px;
      min-height: 32px;
    }
    .node-row:hover { background: var(--hover); }
    .twisty {
      width: 20px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: .7rem;
      flex-shrink: 0;
      user-select: none;
      border-radius: 4px;
    }
    .twisty:hover { color: var(--accent); background: #30363d; }
    .twisty.empty { visibility: hidden; cursor: default; }
    .twisty.open { color: var(--accent); }

    .item-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px 2px 3px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      max-width: 100%;
    }
    .item-pill:hover { border-color: var(--accent); background: #1c2128; }
    .item-pill .qty {
      color: var(--green);
      font-weight: 700;
      font-size: .85rem;
      min-width: 1.4em;
    }
    .item-pill .iname { font-weight: 500; }
    .item-pill .badge {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 4px;
    }
    .badge-base { background: #23863644; color: var(--green); }
    .badge-cycle { background: #d2992244; color: var(--warn); }
    .badge-craft { background: #1f6feb33; color: var(--accent); }
    .badge-chem { background: #8957e533; color: var(--purple); }
    .badge-distill { background: #bf870033; color: var(--warn); }
    .badge-soup { background: #23863633; color: var(--green); }
    .badge-upgrade { background: #da363333; color: var(--red); }
    .badge-alt { background: #30363d; color: var(--muted); }

    .station-tag { font-size: .72rem; color: var(--muted); margin-left: 6px; }
    .children {
      margin-left: 14px;
      padding-left: 12px;
      border-left: 2px solid var(--line);
    }
    .children.hidden { display: none; }

    .alts {
      margin: 4px 0 4px 24px;
      padding: 6px 10px;
      background: #0d1117;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: .88rem;
    }
    .alts-title { color: var(--muted); font-size: .75rem; margin-bottom: 4px; }
    .alt-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      padding: 4px 0;
      border-bottom: 1px solid #21262d;
    }
    .alt-row:last-child { border-bottom: none; }
    .alt-arrow { color: var(--muted); margin: 0 4px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 16px;
    }
    .panel h3 {
      margin: 0 0 10px;
      font-size: .95rem;
      color: var(--accent);
      display: flex; align-items: center; gap: 8px;
    }
    .panel h3 .n {
      background: var(--hover);
      color: var(--muted);
      font-size: .72rem;
      padding: 1px 7px;
      border-radius: 99px;
    }
    .flow {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .flow:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px 3px 3px;
      cursor: pointer;
      font-size: .88rem;
    }
    .chip:hover { border-color: var(--accent); }
    .chip img, .chip .ii { width: 22px; height: 22px; }
    .chip.result-hl {
      border-color: var(--green);
      background: #23863622;
    }
    .chip.result-hl:hover { border-color: var(--green); }
    .type-tag {
      font-size: .65rem; text-transform: uppercase; font-weight: 700;
      padding: 1px 6px; border-radius: 3px; margin-right: 4px;
    }

    .use-group {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .use-group:last-child { margin-bottom: 0; }
    .use-group-head {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      padding: 8px 10px;
      background: var(--hover);
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      text-align: left;
    }
    .use-group-head:hover { background: #30363d; }
    .use-group-head .chev {
      color: var(--muted);
      font-size: .7rem;
      width: 14px;
      transition: transform .15s;
    }
    .use-group.open .use-group-head .chev { transform: rotate(90deg); color: var(--accent); }
    .use-group-body {
      display: none;
      padding: 8px 10px 4px;
      border-top: 1px solid var(--border);
    }
    .use-group.open .use-group-body { display: block; }
    .use-group .flow { margin-bottom: 8px; padding-bottom: 8px; }
    .use-group .flow:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

    .item-header {
      display: flex; gap: 14px; align-items: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .item-header .big-img {
      width: 56px; height: 56px; object-fit: contain;
      background: #000; border-radius: 8px; flex-shrink: 0;
    }
    .item-header h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .meta { color: var(--muted); font-size: .85rem; }
    .meta span { margin-right: 10px; }
    .desc { margin-top: 6px; font-size: .9rem; }

    .empty { color: var(--muted); font-style: italic; font-size: .9rem; }
    .loading { text-align: center; padding: 50px; color: var(--muted); }
    .loading .bar {
      width: 180px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 14px auto 0; overflow: hidden;
    }
    .loading .bar i {
      display: block; height: 100%; width: 40%; background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    footer {
      text-align: center; padding: 20px; color: var(--muted);
      font-size: .78rem; border-top: 1px solid var(--border); margin-top: 30px;
    }
    footer a { color: var(--accent); }

    .ii-ph {
      width: 28px; height: 28px;
      background: #21262d;
      border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .65rem; color: var(--muted); flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Abiotic <span>Factor</span> Tree</h1>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Type an item…" autocomplete="off" spellcheck="false" />
      <div id="suggestions" role="listbox"></div>
    </div>
    <div class="toolbar">
      <button type="button" id="btn-back" disabled title="Previous item">← Back</button>
      <button type="button" id="btn-expand">Expand all</button>
      <button type="button" id="btn-collapse">Collapse all</button>
    </div>
    <div class="hint">↑↓ · Tab cycle · Enter select</div>
  </header>

  <main id="main">
    <div class="loading" id="loading">Loading data…<div class="bar"><i></i></div></div>
  </main>

  <footer>
    Data &amp; images from the
    <a href="https://abioticfactor.wiki.gg/" target="_blank" rel="noopener">Official Abiotic Factor Wiki</a>.
    Fan tool — not affiliated with Deep Field Games.
  </footer>

  <script>
    let DATA = null;
    let itemMap = new Map();
    let imageMap = new Map();
    let nameList = [];
    let produces = new Map();
    let uses = new Map();
    let salvageOf = new Map();
    let activeIdx = -1;
    let currentSuggestions = [];
    let currentRoot = null;
    let expandState = new Map();
    let historyStack = []; // previous roots for Back

    function norm(s) { return (s || "").trim(); }
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function decodeEntities(s) {
      return String(s || "")
        .replace(/&#39;/g, "'").replace(/&apos;/g, "'")
        .replace(/&amp;/g, "&").replace(/&quot;/g, '"')
        .replace(/&lt;/g, "<").replace(/&gt;/g, ">");
    }

    // Cache working image URLs so we don't re-fail every render
    const imgOkCache = new Map(); // filename -> working src
    const imgFailCache = new Set(); // filenames that fully failed

    function imgCandidates(itemName, filename) {
      // Images are stored as "Item Name.webp" (item name), not wiki filenames
      const name = decodeEntities((itemName || "").trim());
      let clean = decodeEntities((filename || "").trim()).replace(/^.*[\\/]/, "");

      const localNames = [];
      function add(n) {
        if (!n) return;
        localNames.push(n);
        localNames.push(n.replace(/ /g, "_"));
        localNames.push(n.replace(/ /g, "%20"));
      }

      // Primary: item name as filename (matches user's images folder)
      if (name) {
        add(name + ".webp");
        add(name + ".WEBP");
        // strip characters often removed from file names
        const safe = name.replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim();
        if (safe !== name) {
          add(safe + ".webp");
          add(safe + ".WEBP");
        }
        // parentheses: "Wooden Mannequin (F)" -> "Wooden Mannequin F.webp"
        if (name.indexOf("(") !== -1) {
          const noParen = name.replace(/\(([^)]*)\)/g, "$1").replace(/\s+/g, " ").trim();
          add(noParen + ".webp");
          const stripParen = name.replace(/\s*\([^)]*\)/g, "").replace(/\s+/g, " ").trim();
          add(stripParen + ".webp");
        }
        if (name.indexOf("'") !== -1) {
          add(name.replace(/'/g, "") + ".webp");
          add(name.replace(/'/g, "_") + ".webp");
        }
        if (name.indexOf("&") !== -1) {
          add(name.replace(/&/g, "and") + ".webp");
          add(name.replace(/ & /g, " ") + ".webp");
        }
        // periods in names like "A.E.G.I.S. Helmet" sometimes kept as-is (already covered)
      }

      // Secondary: wiki image filename if present
      if (clean) {
        add(clean);
        const noExt = clean.replace(/\.webp$/i, "");
        add(noExt + ".webp");
        add(noExt + ".WEBP");
      }

      const seen = new Set();
      const cands = [];
      for (const n of localNames) {
        const key = n.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        cands.push("images/" + n);
      }

      if (clean) {
        const us = clean.replace(/ /g, "_");
        cands.push(
          "https://abioticfactor.wiki.gg/images/" + us,
          "https://abioticfactor.wiki.gg/wiki/Special:FilePath/" + encodeURIComponent(clean),
          "https://abioticfactor.wiki.gg/wiki/Special:Redirect/file/" + encodeURIComponent(clean)
        );
      }
      return cands;
    }

    function itemImgHtml(name, size) {
      size = size || 28;
      const fn = imageMap.get(name) || "";
      const cacheKey = name; // images are named by item name

      if (imgFailCache.has(cacheKey)) {
        return '<span class="ii-ph" style="width:' + size + 'px;height:' + size + 'px">' +
          esc((name || "?")[0] || "?") + '</span>';
      }
      if (imgOkCache.has(cacheKey)) {
        const src = imgOkCache.get(cacheKey);
        return '<img class="ii" src="' + esc(src) + '" width="' + size + '" height="' + size +
          '" alt="" data-fn="' + esc(cacheKey) + '" />';
      }

      const cands = imgCandidates(name, fn);
      if (!cands.length) {
        return '<span class="ii-ph" style="width:' + size + 'px;height:' + size + 'px">' +
          esc((name || "?")[0] || "?") + '</span>';
      }
      return '<img class="ii" data-cands=\'' + esc(JSON.stringify(cands)) + '\' data-ci="0" data-fn="' + esc(cacheKey) + '" ' +
        'src="' + esc(cands[0]) + '" width="' + size + '" height="' + size + '" alt="" ' +
        'onerror="imgFallback(this)" onload="imgLoaded(this)" />';
    }

    window.imgLoaded = function(el) {
      try {
        const fn = el.getAttribute("data-fn");
        if (fn && el.src) imgOkCache.set(fn, el.getAttribute("src") || el.src);
      } catch (_) {}
    };

    window.imgFallback = function(el) {
      try {
        if (el.getAttribute("data-done") === "1") return;
        const cands = JSON.parse(el.getAttribute("data-cands") || "[]");
        let ci = parseInt(el.getAttribute("data-ci") || "0", 10) + 1;
        if (ci < cands.length) {
          el.setAttribute("data-ci", String(ci));
          // Clear src first to force reload on same-origin edge cases
          el.removeAttribute("src");
          el.src = cands[ci];
        } else {
          el.setAttribute("data-done", "1");
          const fn = el.getAttribute("data-fn");
          if (fn) imgFailCache.add(fn);
          const ph = document.createElement("span");
          ph.className = "ii-ph";
          ph.style.width = (el.width || 28) + "px";
          ph.style.height = (el.height || 28) + "px";
          ph.textContent = "?";
          ph.title = fn || "missing icon";
          if (el.parentNode) el.parentNode.replaceChild(ph, el);
        }
      } catch (_) {
        try { el.style.visibility = "hidden"; } catch (__) {}
      }
    };

    function addRecipe(map, key, recipe) {
      if (!key) return;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(recipe);
    }

    function buildIndexes() {
      itemMap.clear(); imageMap.clear();
      produces.clear(); uses.clear();
      salvageOf.clear();

      for (const it of DATA.items) {
        const n = norm(it.name);
        if (!n) continue;
        itemMap.set(n, it);
        if (it.image) imageMap.set(n, decodeEntities(it.image));
      }
      nameList = Array.from(itemMap.keys()).sort(function(a, b) { return a.localeCompare(b); });

      function pushCraftLike(r, type, station, maxIng) {
        const result = norm(r.resultItem);
        const recipe = {
          type: type, station: station,
          duration: r.craftDuration || "",
          result: result,
          resultAmount: parseInt(r.resultAmount, 10) || 1,
          ingredients: []
        };
        for (let i = 1; i <= maxIng; i++) {
          const item = norm(r["ingredient" + i + "Item"]);
          const amt = parseInt(r["ingredient" + i + "Amount"], 10);
          if (item) recipe.ingredients.push({ item: item, amount: isNaN(amt) || !amt ? 1 : amt });
        }
        addRecipe(produces, result, recipe);
        for (const ing of recipe.ingredients) addRecipe(uses, ing.item, recipe);
      }

      for (const r of DATA.recipes) {
        pushCraftLike(r, "craft", norm(r.requiredStation) || "Crafting", 4);
      }
      for (const r of DATA.chemistry) {
        pushCraftLike(r, "chem", "Chemistry Bench", 3);
      }
      for (const r of DATA.soup) {
        const result = norm(r.resultItem);
        const recipe = {
          type: "soup", station: "Cooking (Soup)", duration: r.craftDuration || "",
          result: result, resultAmount: parseInt(r.resultAmount, 10) || 1, ingredients: []
        };
        for (let i = 1; i <= 3; i++) {
          const item = norm(r["ingredient" + i + "Item"]);
          if (item) recipe.ingredients.push({ item: item, amount: 1 });
        }
        addRecipe(produces, result, recipe);
        for (const ing of recipe.ingredients) addRecipe(uses, ing.item, recipe);
      }
      for (const r of DATA.distill) {
        const result = norm(r.resultItem);
        const ing = norm(r.ingredient);
        const recipe = {
          type: "distill", station: "Distillation", duration: r.craftDuration || "",
          result: result, resultAmount: parseInt(r.resultAmount, 10) || 1,
          ingredients: ing ? [{ item: ing, amount: 1 }] : []
        };
        addRecipe(produces, result, recipe);
        if (ing) addRecipe(uses, ing, recipe);
      }
      for (const r of DATA.upgrades) {
        const result = norm(r.resultItem);
        const base = norm(r.baseItem);
        const recipe = {
          type: "upgrade", station: "Upgrade", duration: "",
          result: result, resultAmount: 1, baseItem: base, ingredients: []
        };
        if (base) recipe.ingredients.push({ item: base, amount: 1, isBase: true });
        for (let i = 1; i <= 4; i++) {
          const item = norm(r["ingredient" + i + "Item"]);
          const amt = parseInt(r["ingredient" + i + "Amount"], 10);
          if (item) recipe.ingredients.push({ item: item, amount: isNaN(amt) || !amt ? 1 : amt });
        }
        addRecipe(produces, result, recipe);
        for (const ing of recipe.ingredients) addRecipe(uses, ing.item, recipe);
      }
      for (const s of DATA.scraping) {
        const item = norm(s.item);
        const result = norm(s.result);
        if (!item || !result) continue;
        const min = parseInt(s.amountMin, 10);
        const max = parseInt(s.amountMax, 10);
        const entry = { item: item, result: result, min: isNaN(min) ? 1 : min, max: isNaN(max) ? 1 : max };
        if (!salvageOf.has(item)) salvageOf.set(item, []);
        salvageOf.get(item).push(entry);
      }
    }

    const typeLabel = { craft: "Craft", chem: "Chem", distill: "Distill", soup: "Soup", upgrade: "Upgrade" };
    const typeBadge = { craft: "badge-craft", chem: "badge-chem", distill: "badge-distill", soup: "badge-soup", upgrade: "badge-upgrade" };

    const searchEl = document.getElementById("search");
    const sugEl = document.getElementById("suggestions");
    const btnBack = document.getElementById("btn-back");

    function updateBackBtn() {
      btnBack.disabled = historyStack.length === 0;
      if (historyStack.length) {
        btnBack.title = "Back to " + historyStack[historyStack.length - 1];
      } else {
        btnBack.title = "Previous item";
      }
    }

    function filterSuggestions(q) {
      q = q.trim().toLowerCase();
      if (!q) return [];
      const starts = [], contains = [];
      for (const name of nameList) {
        const lower = name.toLowerCase();
        if (lower.startsWith(q)) starts.push(name);
        else if (lower.includes(q)) contains.push(name);
        if (starts.length + contains.length >= 40) break;
      }
      return starts.concat(contains).slice(0, 25);
    }

    function renderSuggestions() {
      if (!currentSuggestions.length) {
        sugEl.classList.remove("show");
        sugEl.innerHTML = "";
        activeIdx = -1;
        return;
      }
      sugEl.innerHTML = currentSuggestions.map(function(name, i) {
        const cat = (itemMap.get(name) && itemMap.get(name).category) || "";
        return '<div class="sug-item' + (i === activeIdx ? " active" : "") + '" data-idx="' + i + '">' +
          itemImgHtml(name, 28) +
          "<span>" + esc(name) + "</span>" +
          '<span class="cat">' + esc(cat) + "</span></div>";
      }).join("");
      sugEl.classList.add("show");
      const active = sugEl.querySelector(".active");
      if (active) active.scrollIntoView({ block: "nearest" });
    }

    searchEl.addEventListener("input", function() {
      currentSuggestions = filterSuggestions(searchEl.value);
      activeIdx = currentSuggestions.length ? 0 : -1;
      renderSuggestions();
    });

    searchEl.addEventListener("keydown", function(e) {
      if (!sugEl.classList.contains("show") && e.key !== "Tab") {
        if (e.key === "Enter" && searchEl.value.trim()) {
          e.preventDefault();
          const q = searchEl.value.trim();
          const exact = nameList.find(function(n) { return n.toLowerCase() === q.toLowerCase(); });
          if (exact) selectItem(exact, true);
          else {
            currentSuggestions = filterSuggestions(q);
            if (currentSuggestions[0]) selectItem(currentSuggestions[0], true);
          }
        }
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!currentSuggestions.length) return;
        activeIdx = (activeIdx + 1) % currentSuggestions.length;
        renderSuggestions();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!currentSuggestions.length) return;
        activeIdx = (activeIdx - 1 + currentSuggestions.length) % currentSuggestions.length;
        renderSuggestions();
      } else if (e.key === "Tab") {
        e.preventDefault();
        if (!currentSuggestions.length) return;
        activeIdx = e.shiftKey
          ? (activeIdx - 1 + currentSuggestions.length) % currentSuggestions.length
          : (activeIdx + 1) % currentSuggestions.length;
        searchEl.value = currentSuggestions[activeIdx];
        renderSuggestions();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIdx >= 0 && currentSuggestions[activeIdx]) selectItem(currentSuggestions[activeIdx], true);
      } else if (e.key === "Escape") {
        sugEl.classList.remove("show");
        activeIdx = -1;
      }
    });

    sugEl.addEventListener("mousedown", function(e) {
      const item = e.target.closest(".sug-item");
      if (!item) return;
      e.preventDefault();
      const idx = parseInt(item.dataset.idx, 10);
      if (currentSuggestions[idx]) selectItem(currentSuggestions[idx], true);
    });
    searchEl.addEventListener("blur", function() {
      setTimeout(function() { sugEl.classList.remove("show"); }, 150);
    });

    // pushHistory: true when navigating to a new item (search or click), false when going back
    function selectItem(name, pushHistory) {
      if (pushHistory && currentRoot && currentRoot !== name) {
        historyStack.push(currentRoot);
      }
      searchEl.value = name;
      sugEl.classList.remove("show");
      activeIdx = -1;
      currentSuggestions = [];
      expandState = new Map();
      currentRoot = name;
      updateBackBtn();
      showItem(name);
      searchEl.focus();
    }

    function goBack() {
      if (!historyStack.length) return;
      const prev = historyStack.pop();
      updateBackBtn();
      searchEl.value = prev;
      expandState = new Map();
      currentRoot = prev;
      showItem(prev);
      searchEl.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    btnBack.addEventListener("click", goBack);

    // Union of unique ingredients across ALL production recipes
    function allUniqueIngredients(itemName) {
      const all = produces.get(itemName) || [];
      const map = new Map(); // item -> max amount seen
      for (const r of all) {
        for (const ing of r.ingredients) {
          const prev = map.get(ing.item);
          if (prev == null || ing.amount > prev) map.set(ing.item, ing.amount);
        }
      }
      return Array.from(map.entries()).map(function(e) {
        return { item: e[0], amount: e[1] };
      });
    }

    function preferredRecipes(itemName) {
      const all = produces.get(itemName) || [];
      const primary = all.filter(function(r) { return r.type !== "upgrade"; });
      return primary.length ? primary : all;
    }

    function renderTreeNode(itemName, amount, itemPath, depth) {
      const allRecipes = produces.get(itemName) || [];
      // Children = union of unique ingredients from all recipes
      const kids = allUniqueIngredients(itemName);
      const hasKids = kids.length > 0;
      const cycle = itemPath.indexOf(itemName) !== -1;
      const isBase = !hasKids || cycle || depth > 14;
      const pathKeyStr = itemPath.join(">") + ">" + itemName;

      let open;
      if (window.__forceExpandAll) open = !isBase;
      else if (window.__forceCollapseAll) open = false;
      else if (expandState.has(pathKeyStr)) open = expandState.get(pathKeyStr);
      // Only root (depth 0) open by default; all children closed
      else open = !isBase && depth === 0;

      let badges = "";
      if (cycle) badges += '<span class="badge badge-cycle">cycle</span>';
      else if (isBase) badges += '<span class="badge badge-base">base</span>';
      if (allRecipes[0] && !isBase && !cycle) {
        badges += '<span class="badge ' + (typeBadge[allRecipes[0].type] || "") + '">' +
          (typeLabel[allRecipes[0].type] || allRecipes[0].type) + "</span>";
      }

      const twisty = isBase
        ? '<span class="twisty empty"></span>'
        : '<span class="twisty ' + (open ? "open" : "") + '" data-tkey="' + esc(pathKeyStr) +
          '" title="Expand/collapse">' + (open ? "▼" : "▶") + "</span>";

      const qtyHtml = depth > 0 ? '<span class="qty">' + amount + "×</span>" : "";

      let station = "";
      if (allRecipes[0] && !isBase && !cycle) {
        station = '<span class="station-tag">' + esc(allRecipes[0].station) +
          (allRecipes[0].duration ? " · " + esc(allRecipes[0].duration) : "") + "</span>";
      }

      let html = '<div class="node"><div class="node-row">' + twisty +
        '<span class="item-pill" data-focus="' + esc(itemName) + '">' +
        itemImgHtml(itemName, 26) + qtyHtml +
        '<span class="iname">' + esc(itemName) + "</span>" + badges +
        "</span>" + station + "</div>";

      // Show all recipe variants when expanded
      if (allRecipes.length > 1 && open && !cycle) {
        html += '<div class="alts"><div class="alts-title">' + allRecipes.length +
          " recipes — tree lists every unique ingredient from all of them</div>";
        for (const r of allRecipes) {
          const ings = r.ingredients.map(function(ing) {
            return '<span class="chip" data-focus="' + esc(ing.item) + '">' +
              itemImgHtml(ing.item, 20) + '<span class="qty">' + ing.amount + "×</span>" +
              esc(ing.item) + "</span>";
          }).join('<span class="alt-arrow">+</span>');
          html += '<div class="alt-row"><span class="type-tag badge ' + (typeBadge[r.type] || "") + '">' +
            (typeLabel[r.type] || r.type) + "</span>" + (ings || "—") +
            '<span class="alt-arrow">→</span>' +
            '<span class="chip">' + itemImgHtml(r.result, 20) +
            '<span class="qty">' + r.resultAmount + "×</span>" + esc(r.result) + "</span>" +
            '<span class="station-tag">' + esc(r.station) + "</span></div>";
        }
        html += "</div>";
      }

      if (hasKids && !cycle && depth <= 14) {
        html += '<div class="children ' + (open ? "" : "hidden") + '">';
        const nextPath = itemPath.concat([itemName]);
        for (const ing of kids) {
          html += renderTreeNode(ing.item, ing.amount, nextPath, depth + 1);
        }
        html += "</div>";
      }

      html += "</div>";
      return html;
    }

    function showItem(name) {
      const main = document.getElementById("main");
      const it = itemMap.get(name);
      const asInput = uses.get(name) || [];
      const yieldsOnSalvage = salvageOf.get(name) || [];

      let html = "";

      let headerImg = itemImgHtml(name, 56);
      headerImg = headerImg.replace('class="ii"', 'class="ii big-img"');

      html += '<div class="item-header">' + headerImg + "<div><h2>" + esc(name) + "</h2>" +
        '<div class="meta">' +
        (it && it.category ? "<span>" + esc(it.category) + "</span>" : "") +
        (it && it.weight != null && it.weight !== "" ? "<span>Wt " + esc(it.weight) + "</span>" : "") +
        (it && it.stackSize ? "<span>Stack " + esc(it.stackSize) + "</span>" : "") +
        (it && it.tier ? "<span>Tier " + esc(it.tier) + "</span>" : "") +
        "</div>" +
        (it && it.description ? '<div class="desc">' + esc(it.description) + "</div>" : "") +
        "</div></div>";

      // Sources (how to obtain this item)
      const sources = (it && it.sources) || [];
      html += '<div class="panel"><h3>Sources <span class="n">' + sources.length + "</span></h3>";
      if (sources.length) {
        for (const src of sources) {
          if (src.type === "soup_any" || (src.type === "soup" && src.items && src.items.length)) {
            html += '<p style="margin:0 0 8px;font-size:.9rem">' + esc(src.description || "") + "</p>";
            if (src.items && src.items.length) {
              html += '<ul style="margin:0;padding-left:18px;list-style:none">';
              for (const item of src.items) {
                html += '<li style="margin:4px 0"><span class="chip" data-focus="' + esc(item) + '">' +
                  itemImgHtml(item, 22) + esc(item) + "</span></li>";
              }
              html += "</ul>";
            }
          } else if (src.type === "cook") {
            html += '<p style="margin:0 0 8px;font-size:.9rem">' + esc(src.description || "") + "</p>";
            if (src.items && src.items.length) {
              html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
              for (const item of src.items) {
                html += '<span class="chip" data-focus="' + esc(item) + '">' +
                  itemImgHtml(item, 22) + esc(item) + "</span>";
              }
              html += "</div>";
            }
          } else {
            // craft / chem / distill / upgrade
            const ings = (src.ingredients || []).map(function(ing) {
              return '<span class="chip" data-focus="' + esc(ing.item) + '">' +
                itemImgHtml(ing.item, 20) + '<span class="qty">' + (ing.amount || 1) + "×</span>" +
                esc(ing.item) + "</span>";
            }).join('<span class="alt-arrow">+</span>');
            html += '<div class="flow"><span class="type-tag badge ' + (typeBadge[src.type] || "badge-craft") + '">' +
              (typeLabel[src.type] || src.type) + "</span>" +
              (ings || "—") +
              '<span class="alt-arrow">→</span>' +
              '<span class="chip result-hl">' + itemImgHtml(name, 20) +
              '<span class="qty">' + (src.resultAmount || 1) + "×</span>" + esc(name) + "</span>" +
              (src.station ? '<span class="station-tag">' + esc(src.station) +
                (src.duration ? " · " + esc(src.duration) : "") + "</span>" : "") +
              "</div>";
          }
        }
      } else {
        html += '<p class="empty">No crafting/cooking sources recorded. (May be found in the world, looted, or obtained another way.)</p>';
      }
      html += "</div>";

      html += '<section style="margin-bottom:16px">' +
        '<h3 style="margin:0 0 8px;color:var(--accent);font-size:1rem">Recipe tree → base components</h3>' +
        '<p style="margin:0 0 8px;color:var(--muted);font-size:.82rem">' +
        "Root is open; children start collapsed. Expand branches or use Expand all. Multiple recipes → all unique ingredients appear in the tree." +
        '</p><div class="tree-root" id="tree-root">' +
        renderTreeNode(name, 1, [], 0) +
        "</div></section>";

      // Used as ingredient — grouped by type with collapsible sections
      html += '<div class="panel"><h3>Used as ingredient <span class="n">' + asInput.length + "</span></h3>";
      if (asInput.length) {
        const byType = {};
        const typeOrder = ["craft", "chem", "soup", "distill", "upgrade"];
        for (const r of asInput) {
          const t = r.type || "craft";
          if (!byType[t]) byType[t] = [];
          byType[t].push(r);
        }
        const ordered = typeOrder.filter(function(t) { return byType[t]; })
          .concat(Object.keys(byType).filter(function(t) { return typeOrder.indexOf(t) === -1; }));

        for (const t of ordered) {
          const list = byType[t];
          const openByDefault = list.length <= 6;
          html += '<div class="use-group' + (openByDefault ? " open" : "") + '" data-ugroup="' + esc(t) + '">' +
            '<button type="button" class="use-group-head">' +
            '<span class="chev">▶</span>' +
            '<span class="type-tag badge ' + (typeBadge[t] || "") + '">' + (typeLabel[t] || t) + "</span>" +
            '<span>' + list.length + " recipe" + (list.length === 1 ? "" : "s") + "</span>" +
            "</button><div class=\"use-group-body\">";

          for (const r of list) {
            const ings = r.ingredients.map(function(ing) {
              return '<span class="chip" data-focus="' + esc(ing.item) + '">' +
                itemImgHtml(ing.item, 20) + '<span class="qty">' + ing.amount + "×</span>" +
                esc(ing.item) + "</span>";
            }).join('<span class="alt-arrow">+</span>');
            html += '<div class="flow">' + (ings || "—") +
              '<span class="alt-arrow">→</span>' +
              '<span class="chip result-hl" data-focus="' + esc(r.result) + '">' +
              itemImgHtml(r.result, 20) + '<span class="qty">' + r.resultAmount + "×</span>" +
              esc(r.result) + "</span>" +
              (r.station ? '<span class="station-tag">' + esc(r.station) +
                (r.duration ? " · " + esc(r.duration) : "") + "</span>" : "") +
              "</div>";
          }
          html += "</div></div>";
        }
      } else html += '<p class="empty">Not used in any recipe.</p>';
      html += "</div>";

      // Salvage Results only
      html += '<div class="panel"><h3>Salvage Results <span class="n">' + yieldsOnSalvage.length + "</span></h3>";
      if (yieldsOnSalvage.length) {
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
        for (const s of yieldsOnSalvage) {
          const range = s.min === s.max ? String(s.min) : s.min + "–" + s.max;
          html += '<span class="chip" data-focus="' + esc(s.result) + '">' +
            itemImgHtml(s.result, 20) + esc(s.result) + ' <span class="qty">×' + range + "</span></span>";
        }
        html += "</div>";
      } else {
        html += '<p class="empty">No salvage yields recorded for this item.</p>';
      }
      html += "</div>";

      main.innerHTML = html;
      bindTreeEvents(main);
    }

    function bindTreeEvents(root) {
      root.querySelectorAll("[data-tkey]").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.stopPropagation();
          const key = el.getAttribute("data-tkey");
          const wasOpen = el.classList.contains("open");
          expandState.set(key, !wasOpen);
          if (currentRoot) showItem(currentRoot);
        });
      });
      root.querySelectorAll("[data-focus]").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.stopPropagation();
          const n = el.getAttribute("data-focus");
          if (n && itemMap.has(n)) {
            selectItem(n, true);
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
      });
      root.querySelectorAll(".use-group-head").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.stopPropagation();
          const group = el.closest(".use-group");
          if (group) group.classList.toggle("open");
        });
      });
    }

    document.getElementById("btn-expand").onclick = function() {
      if (!currentRoot) return;
      window.__forceExpandAll = true;
      expandState = new Map();
      showItem(currentRoot);
      window.__forceExpandAll = false;
    };
    document.getElementById("btn-collapse").onclick = function() {
      if (!currentRoot) return;
      window.__forceCollapseAll = true;
      expandState = new Map();
      showItem(currentRoot);
      window.__forceCollapseAll = false;
    };

    async function boot() {
      try {
        const res = await fetch("data.json");
        DATA = await res.json();
        buildIndexes();
        document.getElementById("loading").remove();
        document.getElementById("main").innerHTML =
          '<div class="status">Loaded ' + nameList.length + " items · " + DATA.recipes.length +
          " craft · " + DATA.chemistry.length + " chemistry · " + DATA.distill.length +
          " distill · " + DATA.soup.length + " soups · " + DATA.upgrades.length +
          " upgrades. Type an item. Use ← Back after clicking into ingredients.</div>";
        searchEl.focus();
      } catch (err) {
        document.getElementById("loading").innerHTML =
          '<p style="color:var(--red)">Failed to load data.json: ' + esc(err.message) + "</p>";
      }
    }
    boot();
  </script>
</body>
</html>
