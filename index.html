<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abiotic Factor Recipe Tree</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --warn: #d29922;
      --purple: #d2a8ff;
      --red: #f85149;
      --hover: #21262d;
      --line: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
    header h1 span { color: var(--accent); }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 480px; }
    #search {
      width: 100%;
      padding: 9px 12px;
      font-size: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
    }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.2); }
    #suggestions {
      position: absolute; left: 0; right: 0; top: 100%;
      margin-top: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    #suggestions.show { display: block; }
    .sug-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover, .sug-item.active { background: var(--hover); }
    .sug-item img, .ii {
      width: 28px; height: 28px; object-fit: contain;
      background: #000; border-radius: 4px; flex-shrink: 0;
    }
    .sug-item .cat { font-size: .72rem; color: var(--muted); margin-left: auto; }
    .hint { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar button {
      background: var(--hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: .85rem;
    }
    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar button:disabled { opacity: .4; cursor: default; border-color: var(--border); color: var(--muted); }

    main { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .status { color: var(--muted); font-size: .88rem; margin-bottom: 12px; }

    .tree-root {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px 12px 4px;
      overflow-x: auto;
    }
    .node { position: relative; margin: 2px 0; }
    .node-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 6px;
      min-height: 32px;
    }
    .node-row:hover { background: var(--hover); }
    .twisty {
      width: 20px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: .7rem;
      flex-shrink: 0;
      user-select: none;
      border-radius: 4px;
    }
    .twisty:hover { color: var(--accent); background: #30363d; }
    .twisty.empty { visibility: hidden; cursor: default; }
    .twisty.open { color: var(--accent); }

    .item-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px 2px 3px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      max-width: 100%;
    }
    .item-pill:hover { border-color: var(--accent); background: #1c2128; }
    .item-pill .qty {
      color: var(--green);
      font-weight: 700;
      font-size: .85rem;
      min-width: 1.4em;
    }
    .item-pill .iname { font-weight: 500; }
    .item-pill .badge {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 4px;
    }
    .badge-base { background: #23863644; color: var(--green); }
    .badge-cycle { background: #d2992244; color: var(--warn); }
    .badge-craft { background: #1f6feb33; color: var(--accent); }
    .badge-chem { background: #8957e533; color: var(--purple); }
    .badge-distill { background: #bf870033; color: var(--warn); }
    .badge-soup { background: #23863633; color: var(--green); }
    .badge-upgrade { background: #da363333; color: var(--red); }
    .badge-alt { background: #30363d; color: var(--muted); }

    .station-tag { font-size: .72rem; color: var(--muted); margin-left: 6px; }
    .children {
      margin-left: 14px;
      padding-left: 12px;
      border-left: 2px solid var(--line);
    }
    .children.hidden { display: none; }

    .alts {
      margin: 4px 0 4px 24px;
      padding: 6px 10px;
      background: #0d1117;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: .88rem;
    }
    .alts-title { color: var(--muted); font-size: .75rem; margin-bottom: 4px; }
    .alt-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      padding: 4px 0;
      border-bottom: 1px solid #21262d;
    }
    .alt-row:last-child { border-bottom: none; }
    .alt-arrow { color: var(--muted); margin: 0 4px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 16px;
    }
    .panel h3 {
      margin: 0 0 10px;
      font-size: .95rem;
      color: var(--accent);
      display: flex; align-items: center; gap: 8px;
    }
    .panel h3 .n {
      background: var(--hover);
      color: var(--muted);
      font-size: .72rem;
      padding: 1px 7px;
      border-radius: 99px;
    }
    .flow {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .flow:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px 3px 3px;
      cursor: pointer;
      font-size: .88rem;
    }
    .chip:hover { border-color: var(--accent); }
    .chip img, .chip .ii { width: 22px; height: 22px; }
    .chip.result-hl {
      border-color: var(--green);
      background: #23863622;
    }
    .chip.result-hl:hover { border-color: var(--green); }
    .type-tag {
      font-size: .65rem; text-transform: uppercase; font-weight: 700;
      padding: 1px 6px; border-radius: 3px; margin-right: 4px;
    }

    .use-group {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .use-group:last-child { margin-bottom: 0; }
    .use-group-head {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      padding: 8px 10px;
      background: var(--hover);
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      text-align: left;
    }
    .use-group-head:hover { background: #30363d; }
    .use-group-head .chev {
      color: var(--muted);
      font-size: .7rem;
      width: 14px;
      transition: transform .15s;
    }
    .use-group.open .use-group-head .chev { transform: rotate(90deg); color: var(--accent); }
    .use-group-body {
      display: none;
      padding: 8px 10px 4px;
      border-top: 1px solid var(--border);
    }
    .use-group.open .use-group-body { display: block; }
    .use-group .flow { margin-bottom: 8px; padding-bottom: 8px; }
    .use-group .flow:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

    .item-header {
      display: flex; gap: 14px; align-items: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .item-header .big-img {
      width: 56px; height: 56px; object-fit: contain;
      background: #000; border-radius: 8px; flex-shrink: 0;
    }
    .item-header h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .meta { color: var(--muted); font-size: .85rem; }
    .meta span { margin-right: 10px; }
    .desc { margin-top: 6px; font-size: .9rem; }

    .empty { color: var(--muted); font-style: italic; font-size: .9rem; }
    .loading { text-align: center; padding: 50px; color: var(--muted); }
    .loading .bar {
      width: 180px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 14px auto 0; overflow: hidden;
    }
    .loading .bar i {
      display: block; height: 100%; width: 40%; background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    footer {
      text-align: center; padding: 20px; color: var(--muted);
      font-size: .78rem; border-top: 1px solid var(--border); margin-top: 30px;
    }
    footer a { color: var(--accent); }

    .effect-grid {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-size: .88rem;
    }
    .effect-stat {
      display: inline-flex; align-items: baseline; gap: 6px;
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
    }
    .effect-stat .elabel { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; }
    .effect-stat .eval { color: var(--green); font-weight: 600; }
    .effect-stat .eval.neg { color: var(--red); }
    .buff-chip {
      display: inline-flex; flex-direction: column; gap: 2px;
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      border-radius: 8px;
      padding: 6px 10px;
      max-width: 320px;
    }
    .buff-chip .bname { font-weight: 600; color: var(--accent); font-size: .88rem; }
    .buff-chip .beffect { color: var(--text); font-size: .82rem; white-space: pre-line; }
    .buff-chip .bdesc { color: var(--muted); font-size: .75rem; }
    .buff-chip.remove { background: #da363322; border-color: #da363355; }
    .buff-chip.remove .bname { color: var(--red); }
    .ii-ph {
      width: 28px; height: 28px;
      background: #21262d;
      border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .65rem; color: var(--muted); flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Abiotic <span>Factor</span> Tree</h1>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Type an item…" autocomplete="off" spellcheck="false" />
      <div id="suggestions" role="listbox"></div>
    </div>
    <div class="toolbar">
      <button type="button" id="btn-back" disabled title="Previous item">← Back</button>
      <button type="button" id="btn-expand">Expand all</button>
      <button type="button" id="btn-collapse">Collapse all</button>
    </div>
    <div class="hint">↑↓ · Tab cycle · Enter select</div>
  </header>

  <main id="main">
    <div class="loading" id="loading">Loading data…<div class="bar"><i></i></div></div>
  </main>

  <footer>
    Data &amp; images from the
    <a href="https://abioticfactor.wiki.gg/" target="_blank" rel="noopener">Official Abiotic Factor Wiki</a>.
    Fan tool — not affiliated with Deep Field Games.
  </footer>

  <script>
    let DATA = null;
    let itemMap = new Map();
    let imageMap = new Map();
    let nameList = [];
    let produces = new Map();
    let uses = new Map();
    let salvageOf = new Map();
    let tradesGive = new Map(); // item -> trades where this item is received
    let tradesCost = new Map(); // item -> trades where this item is spent
    let stationProducts = new Map(); // station name -> list of result item names
    let activeIdx = -1;
    let currentSuggestions = [];
    let currentRoot = null;
    let expandState = new Map();
    let historyStack = []; // previous roots for Back

    // Stations / plots that should show a "Produces" panel
    const STATION_ALIASES = {
      "Crafting Bench": ["Crafting Bench", "Inventory or Crafting Bench"],
      "Chemistry Bench": ["Chemistry Bench"],
      "Ammo Station": ["Ammo Station"],
      "Chef's Counter": ["Chef's Counter"],
      "Distillation Bench": ["Distillation"],
      "Enhancement Bench": ["Upgrade"],
      "Repair and Salvage Station": []
    };
    // Garden plots grow plant seeds; digital plot grows cartridges
    const GARDEN_PLOT_NAMES = new Set([
      "Garden Plot (Square)", "Garden Plot (Round)", "Garden Plot (Medium)", "Garden Plot (Large)"
    ]);
    const DIGITAL_PLOT_NAME = "Digital Garden Plot";
    let cooksInto = new Map(); // raw/uncooked -> cooked name
    let cookedFrom = new Map(); // cooked -> raw/uncooked name

    // Browse categories: query keyword -> { title, match(item) }
    const BROWSE_CATEGORIES = [
      { keys: ["weapon", "weapons"], title: "Weapons & Ammo",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("weapon") !== -1; } },
      { keys: ["melee"], title: "Melee weapons",
        match: function(it) { const t = ((it.effects || {}).weaponType || ""); return /melee/i.test(t); } },
      { keys: ["blunt"], title: "Blunt melee",
        match: function(it) { return /blunt/i.test(((it.effects || {}).weaponType || "")); } },
      { keys: ["sharp"], title: "Sharp melee",
        match: function(it) { return /sharp/i.test(((it.effects || {}).weaponType || "")); } },
      { keys: ["ranged", "gun", "guns"], title: "Ranged weapons",
        match: function(it) { return /ranged/i.test(((it.effects || {}).weaponType || "")); } },
      { keys: ["throwable", "throwables"], title: "Throwables",
        match: function(it) { return /throwable/i.test(((it.effects || {}).weaponType || "")); } },
      { keys: ["ammo", "ammunition"], title: "Ammunition",
        match: function(it) {
          const t = ((it.effects || {}).weaponType || "");
          return t === "Ammo" || /ammo/i.test(it.name || "");
        } },
      { keys: ["armor", "armour"], title: "Armor & Gear",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("armor") !== -1; } },
      { keys: ["head", "helmet", "helmets"], title: "Head armor",
        match: function(it) { return ((it.effects || {}).gearSlot || "") === "Head Armor"; } },
      { keys: ["chest", "torso", "body armor"], title: "Chest armor",
        match: function(it) { return ((it.effects || {}).gearSlot || "") === "Chest Armor"; } },
      { keys: ["leg", "legs", "greaves"], title: "Leg armor",
        match: function(it) { return ((it.effects || {}).gearSlot || "") === "Leg Armor"; } },
      { keys: ["arm", "arms", "gauntlet", "gauntlets", "pauldron", "pauldrons"], title: "Arm armor",
        match: function(it) { return ((it.effects || {}).gearSlot || "") === "Arm Armor"; } },
      { keys: ["trinket", "trinkets"], title: "Trinkets",
        match: function(it) { return ((it.effects || {}).gearSlot || "") === "Trinket"; } },
      { keys: ["backpack", "backpacks", "pack", "packs"], title: "Backpacks",
        match: function(it) { return ((it.effects || {}).gearSlot || "") === "Backpack"; } },
      { keys: ["suit", "suits"], title: "Full body suits",
        match: function(it) { return ((it.effects || {}).gearSlot || "") === "Full Body Suit"; } },
      { keys: ["food", "foods"], title: "Food & Cooking",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("food") !== -1; } },
      { keys: ["soup", "soups"], title: "Soups",
        match: function(it) {
          const n = (it.name || "").toLowerCase();
          return /soup|stew|chowder|bisque|goulash|gumbo|consomme|consomm/.test(n);
        } },
      { keys: ["medical", "medicine", "health", "healing"], title: "Health & Medical",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("health") !== -1; } },
      { keys: ["tool", "tools"], title: "Tools",
        match: function(it) { return (it.category || "").toLowerCase() === "tools"; } },
      { keys: ["resource", "resources", "material", "materials"], title: "Resources & Sub-components",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("resource") !== -1; } },
      { keys: ["furniture", "bench", "benches"], title: "Furniture & Benches",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("furniture") !== -1; } },
      { keys: ["farm", "farming", "seed", "seeds"], title: "Farming",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("farm") !== -1; } },
      { keys: ["fish"], title: "Fish",
        match: function(it) { return (it.category || "").toLowerCase() === "fish"; } },
      { keys: ["collectible", "collectibles"], title: "Collectibles",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("collectible") !== -1; } },
      { keys: ["defense", "base defense", "trap", "traps"], title: "Base defense",
        match: function(it) { return (it.category || "").toLowerCase().indexOf("defense") !== -1; } },
    ];

    function norm(s) { return (s || "").trim(); }
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function decodeEntities(s) {
      return String(s || "")
        .replace(/&#39;/g, "'").replace(/&apos;/g, "'")
        .replace(/&amp;/g, "&").replace(/&quot;/g, '"')
        .replace(/&lt;/g, "<").replace(/&gt;/g, ">");
    }

    // Cache working image URLs so we don't re-fail every render
    const imgOkCache = new Map(); // filename -> working src
    const imgFailCache = new Set(); // filenames that fully failed

    function imgCandidates(itemName, filename) {
      // Images are stored as "Item Name.webp" (item name), not wiki filenames
      const name = decodeEntities((itemName || "").trim());
      let clean = decodeEntities((filename || "").trim()).replace(/^.*[\\/]/, "");

      const localNames = [];
      function add(n) {
        if (!n) return;
        localNames.push(n);
        localNames.push(n.replace(/ /g, "_"));
        localNames.push(n.replace(/ /g, "%20"));
      }

      // Primary: item name as filename (matches user's images folder)
      if (name) {
        add(name + ".webp");
        add(name + ".WEBP");
        // strip characters often removed from file names
        const safe = name.replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim();
        if (safe !== name) {
          add(safe + ".webp");
          add(safe + ".WEBP");
        }
        // parentheses: "Wooden Mannequin (F)" -> "Wooden Mannequin F.webp"
        if (name.indexOf("(") !== -1) {
          const noParen = name.replace(/\(([^)]*)\)/g, "$1").replace(/\s+/g, " ").trim();
          add(noParen + ".webp");
          const stripParen = name.replace(/\s*\([^)]*\)/g, "").replace(/\s+/g, " ").trim();
          add(stripParen + ".webp");
        }
        if (name.indexOf("'") !== -1) {
          add(name.replace(/'/g, "") + ".webp");
          add(name.replace(/'/g, "_") + ".webp");
        }
        if (name.indexOf("&") !== -1) {
          add(name.replace(/&/g, "and") + ".webp");
          add(name.replace(/ & /g, " ") + ".webp");
        }
        // periods in names like "A.E.G.I.S. Helmet" sometimes kept as-is (already covered)
      }

      // Secondary: wiki image filename if present
      if (clean) {
        add(clean);
        const noExt = clean.replace(/\.webp$/i, "");
        add(noExt + ".webp");
        add(noExt + ".WEBP");
      }

      const seen = new Set();
      const cands = [];
      for (const n of localNames) {
        const key = n.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        cands.push("images/" + n);
      }

      if (clean) {
        const us = clean.replace(/ /g, "_");
        cands.push(
          "https://abioticfactor.wiki.gg/images/" + us,
          "https://abioticfactor.wiki.gg/wiki/Special:FilePath/" + encodeURIComponent(clean),
          "https://abioticfactor.wiki.gg/wiki/Special:Redirect/file/" + encodeURIComponent(clean)
        );
      }
      return cands;
    }

    function itemImgHtml(name, size) {
      size = size || 28;
      const fn = imageMap.get(name) || "";
      const cacheKey = name; // images are named by item name

      if (imgFailCache.has(cacheKey)) {
        return '<span class="ii-ph" style="width:' + size + 'px;height:' + size + 'px">' +
          esc((name || "?")[0] || "?") + '</span>';
      }
      if (imgOkCache.has(cacheKey)) {
        const src = imgOkCache.get(cacheKey);
        return '<img class="ii" src="' + esc(src) + '" width="' + size + '" height="' + size +
          '" alt="" data-fn="' + esc(cacheKey) + '" />';
      }

      const cands = imgCandidates(name, fn);
      if (!cands.length) {
        return '<span class="ii-ph" style="width:' + size + 'px;height:' + size + 'px">' +
          esc((name || "?")[0] || "?") + '</span>';
      }
      return '<img class="ii" data-cands=\'' + esc(JSON.stringify(cands)) + '\' data-ci="0" data-fn="' + esc(cacheKey) + '" ' +
        'src="' + esc(cands[0]) + '" width="' + size + '" height="' + size + '" alt="" ' +
        'onerror="imgFallback(this)" onload="imgLoaded(this)" />';
    }

    window.imgLoaded = function(el) {
      try {
        const fn = el.getAttribute("data-fn");
        if (fn && el.src) imgOkCache.set(fn, el.getAttribute("src") || el.src);
      } catch (_) {}
    };

    window.imgFallback = function(el) {
      try {
        if (el.getAttribute("data-done") === "1") return;
        const cands = JSON.parse(el.getAttribute("data-cands") || "[]");
        let ci = parseInt(el.getAttribute("data-ci") || "0", 10) + 1;
        if (ci < cands.length) {
          el.setAttribute("data-ci", String(ci));
          // Clear src first to force reload on same-origin edge cases
          el.removeAttribute("src");
          el.src = cands[ci];
        } else {
          el.setAttribute("data-done", "1");
          const fn = el.getAttribute("data-fn");
          if (fn) imgFailCache.add(fn);
          const ph = document.createElement("span");
          ph.className = "ii-ph";
          ph.style.width = (el.width || 28) + "px";
          ph.style.height = (el.height || 28) + "px";
          ph.textContent = "?";
          ph.title = fn || "missing icon";
          if (el.parentNode) el.parentNode.replaceChild(ph, el);
        }
      } catch (_) {
        try { el.style.visibility = "hidden"; } catch (__) {}
      }
    };

    function addRecipe(map, key, recipe) {
      if (!key) return;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(recipe);
    }

    function buildIndexes() {
      itemMap.clear(); imageMap.clear();
      produces.clear(); uses.clear();
      salvageOf.clear();
      tradesGive.clear(); tradesCost.clear();
      stationProducts.clear();

      for (const it of DATA.items) {
        const n = norm(it.name);
        if (!n) continue;
        itemMap.set(n, it);
        if (it.image) imageMap.set(n, decodeEntities(it.image));
      }
      nameList = Array.from(itemMap.keys()).sort(function(a, b) { return a.localeCompare(b); });

      function addTrade(map, key, trade) {
        if (!key) return;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(trade);
      }
      for (const t of (DATA.trades || [])) {
        addTrade(tradesGive, norm(t.gives), t);
        addTrade(tradesCost, norm(t.costs), t);
      }

      function addStationProduct(station, result) {
        station = norm(station);
        result = norm(result);
        if (!station || !result) return;
        if (!stationProducts.has(station)) stationProducts.set(station, []);
        const list = stationProducts.get(station);
        if (list.indexOf(result) === -1) list.push(result);
      }

      function pushCraftLike(r, type, station, maxIng) {
        const result = norm(r.resultItem);
        const recipe = {
          type: type, station: station,
          duration: r.craftDuration || "",
          result: result,
          resultAmount: parseInt(r.resultAmount, 10) || 1,
          ingredients: []
        };
        for (let i = 1; i <= maxIng; i++) {
          const item = norm(r["ingredient" + i + "Item"]);
          const amt = parseInt(r["ingredient" + i + "Amount"], 10);
          if (item) recipe.ingredients.push({ item: item, amount: isNaN(amt) || !amt ? 1 : amt });
        }
        addRecipe(produces, result, recipe);
        for (const ing of recipe.ingredients) addRecipe(uses, ing.item, recipe);
        addStationProduct(station, result);
      }

      for (const r of DATA.recipes) {
        pushCraftLike(r, "craft", norm(r.requiredStation) || "Crafting", 4);
      }
      for (const r of DATA.chemistry) {
        pushCraftLike(r, "chem", "Chemistry Bench", 3);
      }
      for (const r of DATA.soup) {
        const result = norm(r.resultItem);
        const recipe = {
          type: "soup", station: "Cooking (Soup)", duration: r.craftDuration || "",
          result: result, resultAmount: parseInt(r.resultAmount, 10) || 1, ingredients: []
        };
        for (let i = 1; i <= 3; i++) {
          const item = norm(r["ingredient" + i + "Item"]);
          if (item) recipe.ingredients.push({ item: item, amount: 1 });
        }
        addRecipe(produces, result, recipe);
        for (const ing of recipe.ingredients) addRecipe(uses, ing.item, recipe);
      }
      for (const r of DATA.distill) {
        const result = norm(r.resultItem);
        const ing = norm(r.ingredient);
        const recipe = {
          type: "distill", station: "Distillation", duration: r.craftDuration || "",
          result: result, resultAmount: parseInt(r.resultAmount, 10) || 1,
          ingredients: ing ? [{ item: ing, amount: 1 }] : []
        };
        addRecipe(produces, result, recipe);
        if (ing) addRecipe(uses, ing, recipe);
        addStationProduct("Distillation", result);
      }
      for (const r of DATA.upgrades) {
        const result = norm(r.resultItem);
        const base = norm(r.baseItem);
        const recipe = {
          type: "upgrade", station: "Upgrade", duration: "",
          result: result, resultAmount: 1, baseItem: base, ingredients: []
        };
        if (base) recipe.ingredients.push({ item: base, amount: 1, isBase: true });
        for (let i = 1; i <= 4; i++) {
          const item = norm(r["ingredient" + i + "Item"]);
          const amt = parseInt(r["ingredient" + i + "Amount"], 10);
          if (item) recipe.ingredients.push({ item: item, amount: isNaN(amt) || !amt ? 1 : amt });
        }
        addRecipe(produces, result, recipe);
        for (const ing of recipe.ingredients) addRecipe(uses, ing.item, recipe);
        addStationProduct("Upgrade", result);
      }

      // Sort station product lists
      stationProducts.forEach(function(list, key) {
        list.sort(function(a, b) { return a.localeCompare(b); });
      });

      // Cooked / uncooked links
      cooksInto.clear(); cookedFrom.clear();
      for (const it of DATA.items) {
        for (const s of (it.sources || [])) {
          if (s.type === "cook" && s.items) {
            for (const raw of s.items) {
              const r = norm(raw), c = norm(it.name);
              if (r && c) { cooksInto.set(r, c); cookedFrom.set(c, r); }
            }
          }
        }
      }
      // Heuristic: Raw X -> Cooked X / X
      for (const name of nameList) {
        if (cooksInto.has(name)) continue;
        if (name.indexOf("Raw ") === 0) {
          const base = name.slice(4);
          const cands = ["Cooked " + base, base, "Roasted " + base];
          for (const c of cands) {
            if (itemMap.has(c) && c !== name) {
              cooksInto.set(name, c);
              if (!cookedFrom.has(c)) cookedFrom.set(c, name);
              break;
            }
          }
        } else if (name.indexOf("Uncooked ") === 0) {
          const base = name.slice(9);
          if (itemMap.has(base) && base !== name) {
            cooksInto.set(name, base);
            if (!cookedFrom.has(base)) cookedFrom.set(base, name);
          }
        }
      }
      for (const s of DATA.scraping) {
        const item = norm(s.item);
        const result = norm(s.result);
        if (!item || !result) continue;
        const min = parseInt(s.amountMin, 10);
        const max = parseInt(s.amountMax, 10);
        const entry = { item: item, result: result, min: isNaN(min) ? 1 : min, max: isNaN(max) ? 1 : max };
        if (!salvageOf.has(item)) salvageOf.set(item, []);
        salvageOf.get(item).push(entry);
      }
    }

    const typeLabel = { craft: "Craft", chem: "Chem", distill: "Distill", soup: "Soup", upgrade: "Upgrade" };
    const typeBadge = { craft: "badge-craft", chem: "badge-chem", distill: "badge-distill", soup: "badge-soup", upgrade: "badge-upgrade" };

    const searchEl = document.getElementById("search");
    const sugEl = document.getElementById("suggestions");
    const btnBack = document.getElementById("btn-back");

    function updateBackBtn() {
      btnBack.disabled = historyStack.length === 0;
      if (historyStack.length) {
        btnBack.title = "Back to " + historyStack[historyStack.length - 1];
      } else {
        btnBack.title = "Previous item";
      }
    }

    function resolveBrowse(q) {
      q = (q || "").trim().toLowerCase();
      if (!q) return null;
      for (const cat of BROWSE_CATEGORIES) {
        for (const k of cat.keys) {
          if (k === q) return cat;
        }
      }
      return null;
    }

    function itemsForBrowse(cat) {
      const out = [];
      for (const name of nameList) {
        const it = itemMap.get(name);
        if (it && cat.match(it)) out.push(name);
      }
      return out;
    }

    function filterSuggestions(q) {
      q = q.trim().toLowerCase();
      if (!q) return [];
      const results = [];
      // Category browse hits first
      for (const cat of BROWSE_CATEGORIES) {
        for (const k of cat.keys) {
          if (k.startsWith(q) || q.startsWith(k)) {
            results.push({ kind: "browse", key: k, title: cat.title, cat: cat });
            break;
          }
        }
      }
      const starts = [], contains = [];
      for (const name of nameList) {
        const lower = name.toLowerCase();
        if (lower.startsWith(q)) starts.push({ kind: "item", name: name });
        else if (lower.includes(q)) contains.push({ kind: "item", name: name });
        if (starts.length + contains.length >= 40) break;
      }
      return results.concat(starts, contains).slice(0, 30);
    }

    function renderSuggestions() {
      if (!currentSuggestions.length) {
        sugEl.classList.remove("show");
        sugEl.innerHTML = "";
        activeIdx = -1;
        return;
      }
      sugEl.innerHTML = currentSuggestions.map(function(entry, i) {
        if (entry.kind === "browse") {
          return '<div class="sug-item' + (i === activeIdx ? " active" : "") + '" data-idx="' + i + '">' +
            '<span class="ii-ph" style="width:28px;height:28px;font-size:.65rem">☰</span>' +
            "<span>Browse: " + esc(entry.title) + "</span>" +
            '<span class="cat">category</span></div>';
        }
        const name = entry.name;
        const cat = (itemMap.get(name) && itemMap.get(name).category) || "";
        return '<div class="sug-item' + (i === activeIdx ? " active" : "") + '" data-idx="' + i + '">' +
          itemImgHtml(name, 28) +
          "<span>" + esc(name) + "</span>" +
          '<span class="cat">' + esc(cat) + "</span></div>";
      }).join("");
      sugEl.classList.add("show");
      const active = sugEl.querySelector(".active");
      if (active) active.scrollIntoView({ block: "nearest" });
    }

    searchEl.addEventListener("input", function() {
      currentSuggestions = filterSuggestions(searchEl.value);
      activeIdx = currentSuggestions.length ? 0 : -1;
      renderSuggestions();
    });

    searchEl.addEventListener("keydown", function(e) {
      if (!sugEl.classList.contains("show") && e.key !== "Tab") {
        if (e.key === "Enter" && searchEl.value.trim()) {
          e.preventDefault();
          const q = searchEl.value.trim();
          activateSearch(q);
        }
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!currentSuggestions.length) return;
        activeIdx = (activeIdx + 1) % currentSuggestions.length;
        renderSuggestions();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!currentSuggestions.length) return;
        activeIdx = (activeIdx - 1 + currentSuggestions.length) % currentSuggestions.length;
        renderSuggestions();
      } else if (e.key === "Tab") {
        e.preventDefault();
        if (!currentSuggestions.length) return;
        activeIdx = e.shiftKey
          ? (activeIdx - 1 + currentSuggestions.length) % currentSuggestions.length
          : (activeIdx + 1) % currentSuggestions.length;
        const ent = currentSuggestions[activeIdx];
        searchEl.value = ent.kind === "browse" ? ent.key : ent.name;
        renderSuggestions();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIdx >= 0 && currentSuggestions[activeIdx]) activateEntry(currentSuggestions[activeIdx], true);
      } else if (e.key === "Escape") {
        sugEl.classList.remove("show");
        activeIdx = -1;
      }
    });

    sugEl.addEventListener("mousedown", function(e) {
      const item = e.target.closest(".sug-item");
      if (!item) return;
      e.preventDefault();
      const idx = parseInt(item.dataset.idx, 10);
      if (currentSuggestions[idx]) activateEntry(currentSuggestions[idx], true);
    });
    searchEl.addEventListener("blur", function() {
      setTimeout(function() { sugEl.classList.remove("show"); }, 150);
    });

    // pushHistory: true when navigating to a new item (search or click), false when going back
    function activateEntry(entry, pushHistory) {
      if (!entry) return;
      if (entry.kind === "browse") {
        selectBrowse(entry.cat, entry.key || entry.title, pushHistory);
      } else {
        selectItem(entry.name, pushHistory);
      }
    }

    function activateSearch(q) {
      const browse = resolveBrowse(q);
      if (browse) {
        selectBrowse(browse, q, true);
        return;
      }
      const exact = nameList.find(function(n) { return n.toLowerCase() === q.toLowerCase(); });
      if (exact) { selectItem(exact, true); return; }
      currentSuggestions = filterSuggestions(q);
      if (currentSuggestions[0]) activateEntry(currentSuggestions[0], true);
    }

    function selectBrowse(cat, label, pushHistory) {
      const key = "browse:" + cat.title;
      if (pushHistory && currentRoot && currentRoot !== key) {
        historyStack.push(currentRoot);
      }
      searchEl.value = label || cat.keys[0];
      sugEl.classList.remove("show");
      activeIdx = -1;
      currentSuggestions = [];
      expandState = new Map();
      currentRoot = key;
      updateBackBtn();
      showBrowse(cat);
      searchEl.focus();
    }

    function selectItem(name, pushHistory) {
      if (pushHistory && currentRoot && currentRoot !== name) {
        historyStack.push(currentRoot);
      }
      searchEl.value = name;
      sugEl.classList.remove("show");
      activeIdx = -1;
      currentSuggestions = [];
      expandState = new Map();
      currentRoot = name;
      updateBackBtn();
      showItem(name);
      searchEl.focus();
    }

    function showBrowse(cat) {
      const main = document.getElementById("main");
      const list = itemsForBrowse(cat);
      let html = '<div class="item-header"><div><h2>' + esc(cat.title) + "</h2>" +
        '<div class="meta"><span>' + list.length + " items</span></div>" +
        '<div class="desc">Browse matching items. Click any to open its full page.</div></div></div>';
      html += '<div class="panel"><h3>Items <span class="n">' + list.length + "</span></h3>";
      if (!list.length) {
        html += '<p class="empty">No items match this category.</p>';
      } else {
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
        for (const name of list) {
          const it = itemMap.get(name);
          const sub = (it && it.category) ? it.category : "";
          html += '<span class="chip" data-focus="' + esc(name) + '" title="' + esc(sub) + '">' +
            itemImgHtml(name, 22) + esc(name) + "</span>";
        }
        html += "</div>";
      }
      html += "</div>";
      main.innerHTML = html;
      bindTreeEvents(main);
    }

    function goBack() {
      if (!historyStack.length) return;
      const prev = historyStack.pop();
      updateBackBtn();
      expandState = new Map();
      currentRoot = prev;
      if (String(prev).indexOf("browse:") === 0) {
        const title = String(prev).slice(7);
        const cat = BROWSE_CATEGORIES.find(function(c) { return c.title === title; });
        searchEl.value = cat ? cat.keys[0] : title;
        if (cat) showBrowse(cat);
        else showItem(prev);
      } else {
        searchEl.value = prev;
        showItem(prev);
      }
      searchEl.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    btnBack.addEventListener("click", goBack);

    // Union of unique ingredients across ALL production recipes
    function allUniqueIngredients(itemName) {
      const all = produces.get(itemName) || [];
      const map = new Map(); // item -> max amount seen
      for (const r of all) {
        for (const ing of r.ingredients) {
          const prev = map.get(ing.item);
          if (prev == null || ing.amount > prev) map.set(ing.item, ing.amount);
        }
      }
      return Array.from(map.entries()).map(function(e) {
        return { item: e[0], amount: e[1] };
      });
    }

    function preferredRecipes(itemName) {
      const all = produces.get(itemName) || [];
      const primary = all.filter(function(r) { return r.type !== "upgrade"; });
      return primary.length ? primary : all;
    }

    function renderTreeNode(itemName, amount, itemPath, depth) {
      const allRecipes = produces.get(itemName) || [];
      // Children = union of unique ingredients from all recipes
      const kids = allUniqueIngredients(itemName);
      const hasKids = kids.length > 0;
      const cycle = itemPath.indexOf(itemName) !== -1;
      const isBase = !hasKids || cycle || depth > 14;
      const pathKeyStr = itemPath.join(">") + ">" + itemName;

      let open;
      if (window.__forceExpandAll) open = !isBase;
      else if (window.__forceCollapseAll) open = false;
      else if (expandState.has(pathKeyStr)) open = expandState.get(pathKeyStr);
      // Only root (depth 0) open by default; all children closed
      else open = !isBase && depth === 0;

      let badges = "";
      if (cycle) badges += '<span class="badge badge-cycle">cycle</span>';
      else if (isBase) badges += '<span class="badge badge-base">base</span>';
      if (allRecipes[0] && !isBase && !cycle) {
        badges += '<span class="badge ' + (typeBadge[allRecipes[0].type] || "") + '">' +
          (typeLabel[allRecipes[0].type] || allRecipes[0].type) + "</span>";
      }

      const twisty = isBase
        ? '<span class="twisty empty"></span>'
        : '<span class="twisty ' + (open ? "open" : "") + '" data-tkey="' + esc(pathKeyStr) +
          '" title="Expand/collapse">' + (open ? "▼" : "▶") + "</span>";

      const qtyHtml = depth > 0 ? '<span class="qty">' + amount + "×</span>" : "";

      let station = "";
      if (allRecipes[0] && !isBase && !cycle) {
        station = '<span class="station-tag">' + esc(allRecipes[0].station) +
          (allRecipes[0].duration ? " · " + esc(allRecipes[0].duration) : "") + "</span>";
      }

      let html = '<div class="node"><div class="node-row">' + twisty +
        '<span class="item-pill" data-focus="' + esc(itemName) + '">' +
        itemImgHtml(itemName, 26) + qtyHtml +
        '<span class="iname">' + esc(itemName) + "</span>" + badges +
        "</span>" + station + "</div>";

      // Show all recipe variants when expanded
      if (allRecipes.length > 1 && open && !cycle) {
        html += '<div class="alts"><div class="alts-title">' + allRecipes.length +
          " recipes — tree lists every unique ingredient from all of them</div>";
        for (const r of allRecipes) {
          const ings = r.ingredients.map(function(ing) {
            return '<span class="chip" data-focus="' + esc(ing.item) + '">' +
              itemImgHtml(ing.item, 20) + '<span class="qty">' + ing.amount + "×</span>" +
              esc(ing.item) + "</span>";
          }).join('<span class="alt-arrow">+</span>');
          html += '<div class="alt-row"><span class="type-tag badge ' + (typeBadge[r.type] || "") + '">' +
            (typeLabel[r.type] || r.type) + "</span>" + (ings || "—") +
            '<span class="alt-arrow">→</span>' +
            '<span class="chip">' + itemImgHtml(r.result, 20) +
            '<span class="qty">' + r.resultAmount + "×</span>" + esc(r.result) + "</span>" +
            '<span class="station-tag">' + esc(r.station) + "</span></div>";
        }
        html += "</div>";
      }

      if (hasKids && !cycle && depth <= 14) {
        html += '<div class="children ' + (open ? "" : "hidden") + '">';
        const nextPath = itemPath.concat([itemName]);
        for (const ing of kids) {
          html += renderTreeNode(ing.item, ing.amount, nextPath, depth + 1);
        }
        html += "</div>";
      }

      html += "</div>";
      return html;
    }

    function showItem(name) {
      const main = document.getElementById("main");
      const it = itemMap.get(name);
      const asInput = uses.get(name) || [];
      const yieldsOnSalvage = salvageOf.get(name) || [];

      let html = "";

      let headerImg = itemImgHtml(name, 56);
      headerImg = headerImg.replace('class="ii"', 'class="ii big-img"');

      html += '<div class="item-header">' + headerImg + "<div><h2>" + esc(name) + "</h2>" +
        '<div class="meta">' +
        (it && it.category ? "<span>" + esc(it.category) + "</span>" : "") +
        (it && it.weight != null && it.weight !== "" ? "<span>Wt " + esc(it.weight) + "</span>" : "") +
        (it && it.stackSize ? "<span>Stack " + esc(it.stackSize) + "</span>" : "") +
        (it && it.tier ? "<span>Tier " + esc(it.tier) + "</span>" : "") +
        "</div>" +
        (it && it.description ? '<div class="desc">' + esc(it.description) + "</div>" : "") +
        "</div></div>";

      // Effects / buffs / gear stats
      (function() {
        const fx = (it && it.effects) || null;
        if (!fx) return;
        const buffMap = (DATA && DATA.buffs) || {};
        function buffInfo(buffName) {
          const b = buffMap[buffName] || {};
          return { name: buffName, effects: b.effects || "", description: b.description || "", type: b.type || "" };
        }
        let parts = [];
        // Gear
        if (fx.gearSlot || fx.gearArmor || fx.gearColdResist || fx.gearHeatResist || fx.gearCapacity || fx.gearWeightReduction || fx.radiationShielding || fx.gearShieldClass) {
          let stats = [];
          if (fx.gearSlot) stats.push(['Slot', fx.gearSlot]);
          if (fx.gearArmor) stats.push(['Armor', '+' + fx.gearArmor]);
          if (fx.gearColdResist) stats.push(['Cold resist', '+' + fx.gearColdResist]);
          if (fx.gearHeatResist) stats.push(['Heat resist', '+' + fx.gearHeatResist]);
          if (fx.radiationShielding) stats.push(['Rad shield', fx.radiationShielding]);
          if (fx.gearWeightReduction) stats.push(['Weight red.', fx.gearWeightReduction]);
          if (fx.gearCapacity) stats.push(['Capacity', fx.gearCapacity]);
          if (fx.gearShieldClass) stats.push(['Shield class', fx.gearShieldClass]);
          if (stats.length) {
            parts.push('<div class="effect-grid">' + stats.map(function(s) {
              return '<span class="effect-stat"><span class="elabel">' + esc(s[0]) + '</span><span class="eval">' + esc(s[1]) + '</span></span>';
            }).join('') + '</div>');
          }
          if (fx.gearSetBonusHalf || fx.gearSetBonusFull || fx.gearSetBonus) {
            let setHtml = '<div class="effect-grid" style="margin-top:8px">';
            if (fx.gearSetBonusHalf) {
              const bi = buffInfo(fx.gearSetBonusHalf);
              setHtml += '<div class="buff-chip"><span class="bname">2-set: ' + esc(bi.name) + '</span>' +
                (bi.effects ? '<span class="beffect">' + esc(bi.effects) + '</span>' : '') +
                (bi.description ? '<span class="bdesc">' + esc(bi.description) + '</span>' : '') + '</div>';
            }
            if (fx.gearSetBonusFull) {
              const bi = buffInfo(fx.gearSetBonusFull);
              setHtml += '<div class="buff-chip"><span class="bname">Full set: ' + esc(bi.name) + '</span>' +
                (bi.effects ? '<span class="beffect">' + esc(bi.effects) + '</span>' : '') +
                (bi.description ? '<span class="bdesc">' + esc(bi.description) + '</span>' : '') + '</div>';
            }
            if (fx.gearSetBonus) {
              const bi = buffInfo(fx.gearSetBonus);
              setHtml += '<div class="buff-chip"><span class="bname">Set: ' + esc(bi.name) + '</span>' +
                (bi.effects ? '<span class="beffect">' + esc(bi.effects) + '</span>' : '') +
                (bi.description ? '<span class="bdesc">' + esc(bi.description) + '</span>' : '') + '</div>';
            }
            setHtml += '</div>';
            parts.push(setHtml);
          }
        }
        // Weapon
        if (fx.weaponType || fx.weaponDamage) {
          let stats = [];
          if (fx.weaponType) stats.push(['Type', fx.weaponType]);
          if (fx.weaponDamage) stats.push(['Damage', fx.weaponDamage + (fx.weaponDamageType ? ' ' + fx.weaponDamageType : '')]);
          if (fx.weaponBonusDamage) stats.push(['Bonus', fx.weaponBonusDamage + (fx.weaponBonusDamageType ? ' ' + fx.weaponBonusDamageType : '')]);
          parts.push('<div class="effect-grid">' + stats.map(function(s) {
            return '<span class="effect-stat"><span class="elabel">' + esc(s[0]) + '</span><span class="eval">' + esc(s[1]) + '</span></span>';
          }).join('') + '</div>');
        }
        // Consumable fills
        const fills = [];
        if (fx.consumableHungerFill) fills.push(['Hunger', fx.consumableHungerFill]);
        if (fx.consumableThirstFill) fills.push(['Thirst', fx.consumableThirstFill]);
        if (fx.consumableFatigueFill) fills.push(['Fatigue', fx.consumableFatigueFill]);
        if (fx.consumableRadiation) fills.push(['Radiation', fx.consumableRadiation]);
        if (fills.length) {
          parts.push('<div class="effect-grid">' + fills.map(function(s) {
            const neg = String(s[1]).trim().charAt(0) === '-';
            return '<span class="effect-stat"><span class="elabel">' + esc(s[0]) + '</span><span class="eval' + (neg ? ' neg' : '') + '">' + esc(s[1]) + '</span></span>';
          }).join('') + '</div>');
        }
        if (fx.consumableOtherEffects) {
          parts.push('<p style="margin:6px 0 0;font-size:.88rem">' + esc(fx.consumableOtherEffects) + '</p>');
        }
        // Applied buffs
        const adds = [];
        const rems = [];
        for (let i = 1; i <= 6; i++) {
          if (fx['consumableAddsBuff' + i]) adds.push(fx['consumableAddsBuff' + i]);
          if (fx['consumableRemovesBuff' + i]) rems.push(fx['consumableRemovesBuff' + i]);
        }
        if (adds.length || rems.length) {
          let bh = '<div class="effect-grid" style="margin-top:8px">';
          for (const bn of adds) {
            const bi = buffInfo(bn);
            bh += '<div class="buff-chip"><span class="bname">Buff: ' + esc(bi.name) + '</span>' +
              (bi.effects ? '<span class="beffect">' + esc(bi.effects) + '</span>' : '') +
              (bi.description ? '<span class="bdesc">' + esc(bi.description) + '</span>' : '') + '</div>';
          }
          for (const bn of rems) {
            const bi = buffInfo(bn);
            bh += '<div class="buff-chip remove"><span class="bname">Removes: ' + esc(bi.name) + '</span>' +
              (bi.effects ? '<span class="beffect">' + esc(bi.effects) + '</span>' : '') +
              (bi.description ? '<span class="bdesc">' + esc(bi.description) + '</span>' : '') + '</div>';
          }
          bh += '</div>';
          parts.push(bh);
        }
        if (!parts.length) return;
        html += '<div class="panel"><h3>Effects</h3>' + parts.join('') + '</div>';
      })();

      // Cooking links (raw/uncooked <-> cooked)
      (function() {
        const into = cooksInto.get(name);
        const from = cookedFrom.get(name);
        if (!into && !from) return;
        html += '<div class="panel"><h3>Cooking</h3>';
        if (into) {
          html += '<div class="flow"><span class="type-tag badge badge-soup">Cook</span>' +
            '<span class="chip result-hl" data-focus="' + esc(name) + '">' + itemImgHtml(name, 20) + esc(name) + "</span>" +
            '<span class="alt-arrow">→</span>' +
            '<span class="chip" data-focus="' + esc(into) + '">' + itemImgHtml(into, 20) + esc(into) + "</span>" +
            '<span class="station-tag">Stove</span></div>';
        }
        if (from) {
          html += '<div class="flow"><span class="type-tag badge badge-soup">From</span>' +
            '<span class="chip" data-focus="' + esc(from) + '">' + itemImgHtml(from, 20) + esc(from) + "</span>" +
            '<span class="alt-arrow">→</span>' +
            '<span class="chip result-hl" data-focus="' + esc(name) + '">' + itemImgHtml(name, 20) + esc(name) + "</span>" +
            '<span class="station-tag">Stove</span></div>';
        }
        html += "</div>";
      })();

      // Sources: only non-recipe sources (soup_any, cook, etc.).
      // Craft / chem / distill / upgrade / soup recipes already appear in the recipe tree.
      const RECIPE_SOURCE_TYPES = { craft: 1, chem: 1, distill: 1, upgrade: 1, soup: 1 };
      const sources = ((it && it.sources) || []).filter(function(src) {
        if (src.type === "soup_any" || src.type === "cook") return true;
        if (src.type === "soup" && src.items && src.items.length) return true;
        return !RECIPE_SOURCE_TYPES[src.type];
      });
      html += '<div class="panel"><h3>Sources <span class="n">' + sources.length + "</span></h3>";
      if (sources.length) {
        for (const src of sources) {
          if (src.type === "soup_any" || (src.type === "soup" && src.items && src.items.length)) {
            html += '<p style="margin:0 0 8px;font-size:.9rem">' + esc(src.description || "") + "</p>";
            if (src.items && src.items.length) {
              html += '<ul style="margin:0;padding-left:18px;list-style:none">';
              for (const item of src.items) {
                html += '<li style="margin:4px 0"><span class="chip" data-focus="' + esc(item) + '">' +
                  itemImgHtml(item, 22) + esc(item) + "</span></li>";
              }
              html += "</ul>";
            }
          } else if (src.type === "cook") {
            html += '<p style="margin:0 0 8px;font-size:.9rem">' + esc(src.description || "") + "</p>";
            if (src.items && src.items.length) {
              html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
              for (const item of src.items) {
                html += '<span class="chip" data-focus="' + esc(item) + '">' +
                  itemImgHtml(item, 22) + esc(item) + "</span>";
              }
              html += "</div>";
            }
          } else {
            const ings = (src.ingredients || []).map(function(ing) {
              return '<span class="chip" data-focus="' + esc(ing.item) + '">' +
                itemImgHtml(ing.item, 20) + '<span class="qty">' + (ing.amount || 1) + "×</span>" +
                esc(ing.item) + "</span>";
            }).join('<span class="alt-arrow">+</span>');
            html += '<div class="flow"><span class="type-tag badge ' + (typeBadge[src.type] || "badge-craft") + '">' +
              (typeLabel[src.type] || src.type) + "</span>" +
              (ings || "—") +
              '<span class="alt-arrow">→</span>' +
              '<span class="chip result-hl">' + itemImgHtml(name, 20) +
              '<span class="qty">' + (src.resultAmount || 1) + "×</span>" + esc(name) + "</span>" +
              (src.station ? '<span class="station-tag">' + esc(src.station) +
                (src.duration ? " · " + esc(src.duration) : "") + "</span>" : "") +
              "</div>";
          }
        }
      } else {
        html += '<p class="empty">No special sources recorded. Crafting recipes (if any) are shown in the tree below. Item may also be found in the world or looted.</p>';
      }
      html += "</div>";

      // Trading
      const asGives = tradesGive.get(name) || [];
      const asCosts = tradesCost.get(name) || [];
      const tradeCount = asGives.length + asCosts.length;
      html += '<div class="panel"><h3>Trading <span class="n">' + tradeCount + "</span></h3>";
      if (tradeCount) {
        if (asGives.length) {
          html += '<div class="alts-title" style="margin-bottom:6px">Received from trades</div>';
          for (const t of asGives) {
            html += '<div class="flow">' +
              '<span class="chip" data-focus="' + esc(t.costs) + '">' + itemImgHtml(t.costs, 20) +
              '<span class="qty">' + esc(String(t.costsAmount)) + "×</span>" + esc(t.costs) + "</span>" +
              '<span class="alt-arrow">→</span>' +
              '<span class="chip result-hl" data-focus="' + esc(t.gives) + '">' + itemImgHtml(t.gives, 20) +
              '<span class="qty">' + esc(String(t.givesAmount)) + "×</span>" + esc(t.gives) + "</span>" +
              '<span class="station-tag">' + esc(t.trader) +
              (t.stock != null && t.stock !== "" ? " · stock " + esc(String(t.stock)) : "") +
              (t.unlock ? " · " + esc(t.unlock) : "") + "</span></div>";
          }
        }
        if (asCosts.length) {
          html += '<div class="alts-title" style="margin:10px 0 6px">Spent in trades</div>';
          for (const t of asCosts) {
            html += '<div class="flow">' +
              '<span class="chip result-hl" data-focus="' + esc(t.costs) + '">' + itemImgHtml(t.costs, 20) +
              '<span class="qty">' + esc(String(t.costsAmount)) + "×</span>" + esc(t.costs) + "</span>" +
              '<span class="alt-arrow">→</span>' +
              '<span class="chip" data-focus="' + esc(t.gives) + '">' + itemImgHtml(t.gives, 20) +
              '<span class="qty">' + esc(String(t.givesAmount)) + "×</span>" + esc(t.gives) + "</span>" +
              '<span class="station-tag">' + esc(t.trader) +
              (t.stock != null && t.stock !== "" ? " · stock " + esc(String(t.stock)) : "") +
              (t.unlock ? " · " + esc(t.unlock) : "") + "</span></div>";
          }
        }
      } else {
        html += '<p class="empty">Not used in any known NPC or exchanger trade.</p>';
      }
      html += "</div>";

      // Station / plot products helper (rendered after Salvage)
      function collectStationResults(itemName) {
        const results = [];
        const seen = new Set();
        function pushAll(list) {
          if (!list) return;
          for (const r of list) {
            if (!seen.has(r)) { seen.add(r); results.push(r); }
          }
        }
        if (STATION_ALIASES[itemName]) {
          for (const alias of STATION_ALIASES[itemName]) pushAll(stationProducts.get(alias));
        }
        pushAll(stationProducts.get(itemName));
        if (itemName === "Crafting Bench") pushAll(stationProducts.get("Inventory or Crafting Bench"));
        if (GARDEN_PLOT_NAMES.has(itemName)) {
          for (const n of nameList) {
            const lower = n.toLowerCase();
            if (lower.endsWith(" seed") && !lower.includes("cartridge")) {
              if (!seen.has(n)) { seen.add(n); results.push(n); }
            }
            if (n === "Potato" || n === "Carrot" || n === "Aloe") {
              if (!seen.has(n)) { seen.add(n); results.push(n); }
            }
          }
        }
        if (itemName === DIGITAL_PLOT_NAME) {
          for (const n of nameList) {
            const lower = n.toLowerCase();
            if (lower.includes("cartridge") && lower !== "blank printing cartridge") {
              if (!seen.has(n)) { seen.add(n); results.push(n); }
            }
          }
        }
        results.sort(function(a, b) { return a.localeCompare(b); });
        return results;
      }

      html += '<section style="margin-bottom:16px">' +
        '<h3 style="margin:0 0 8px;color:var(--accent);font-size:1rem">Recipe tree → base components</h3>' +
        '<p style="margin:0 0 8px;color:var(--muted);font-size:.82rem">' +
        "Root is open; children start collapsed. Expand branches or use Expand all. Multiple recipes → all unique ingredients appear in the tree." +
        '</p><div class="tree-root" id="tree-root">' +
        renderTreeNode(name, 1, [], 0) +
        "</div></section>";

      // Used as ingredient — grouped by type with collapsible sections
      html += '<div class="panel"><h3>Used as ingredient <span class="n">' + asInput.length + "</span></h3>";
      if (asInput.length) {
        const byType = {};
        const typeOrder = ["craft", "chem", "soup", "distill", "upgrade"];
        for (const r of asInput) {
          const t = r.type || "craft";
          if (!byType[t]) byType[t] = [];
          byType[t].push(r);
        }
        const ordered = typeOrder.filter(function(t) { return byType[t]; })
          .concat(Object.keys(byType).filter(function(t) { return typeOrder.indexOf(t) === -1; }));

        for (const t of ordered) {
          const list = byType[t];
          const openByDefault = list.length <= 6;
          html += '<div class="use-group' + (openByDefault ? " open" : "") + '" data-ugroup="' + esc(t) + '">' +
            '<button type="button" class="use-group-head">' +
            '<span class="chev">▶</span>' +
            '<span class="type-tag badge ' + (typeBadge[t] || "") + '">' + (typeLabel[t] || t) + "</span>" +
            '<span>' + list.length + " recipe" + (list.length === 1 ? "" : "s") + "</span>" +
            "</button><div class=\"use-group-body\">";

          for (const r of list) {
            const ings = r.ingredients.map(function(ing) {
              return '<span class="chip" data-focus="' + esc(ing.item) + '">' +
                itemImgHtml(ing.item, 20) + '<span class="qty">' + ing.amount + "×</span>" +
                esc(ing.item) + "</span>";
            }).join('<span class="alt-arrow">+</span>');
            html += '<div class="flow">' + (ings || "—") +
              '<span class="alt-arrow">→</span>' +
              '<span class="chip result-hl" data-focus="' + esc(r.result) + '">' +
              itemImgHtml(r.result, 20) + '<span class="qty">' + r.resultAmount + "×</span>" +
              esc(r.result) + "</span>" +
              (r.station ? '<span class="station-tag">' + esc(r.station) +
                (r.duration ? " · " + esc(r.duration) : "") + "</span>" : "") +
              "</div>";
          }
          html += "</div></div>";
        }
      } else html += '<p class="empty">Not used in any recipe.</p>';
      html += "</div>";

      // Salvage Results only
      html += '<div class="panel"><h3>Salvage Results <span class="n">' + yieldsOnSalvage.length + "</span></h3>";
      if (yieldsOnSalvage.length) {
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
        for (const s of yieldsOnSalvage) {
          const range = s.min === s.max ? String(s.min) : s.min + "–" + s.max;
          html += '<span class="chip" data-focus="' + esc(s.result) + '">' +
            itemImgHtml(s.result, 20) + esc(s.result) + ' <span class="qty">×' + range + "</span></span>";
        }
        html += "</div>";
      } else {
        html += '<p class="empty">No salvage yields recorded for this item.</p>';
      }
      html += "</div>";

      // Station / plot products (last — secondary info)
      const stationResults = collectStationResults(name);
      if (stationResults.length) {
        const label = GARDEN_PLOT_NAMES.has(name)
          ? "Can grow (seeds / plants)"
          : (name === DIGITAL_PLOT_NAME ? "Can print (cartridges)" : "Can craft / produce");
        html += '<div class="panel"><h3>' + esc(label) + ' <span class="n">' + stationResults.length + "</span></h3>";
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
        for (const r of stationResults) {
          html += '<span class="chip" data-focus="' + esc(r) + '">' + itemImgHtml(r, 22) + esc(r) + "</span>";
        }
        html += "</div></div>";
      }

      main.innerHTML = html;
      bindTreeEvents(main);
    }

    function bindTreeEvents(root) {
      root.querySelectorAll("[data-tkey]").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.stopPropagation();
          const key = el.getAttribute("data-tkey");
          const wasOpen = el.classList.contains("open");
          expandState.set(key, !wasOpen);
          if (currentRoot) showItem(currentRoot);
        });
      });
      root.querySelectorAll("[data-focus]").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.stopPropagation();
          const n = el.getAttribute("data-focus");
          if (n && itemMap.has(n)) {
            selectItem(n, true);
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
      });
      root.querySelectorAll(".use-group-head").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.stopPropagation();
          const group = el.closest(".use-group");
          if (group) group.classList.toggle("open");
        });
      });
    }

    document.getElementById("btn-expand").onclick = function() {
      if (!currentRoot || String(currentRoot).indexOf("browse:") === 0) return;
      window.__forceExpandAll = true;
      expandState = new Map();
      showItem(currentRoot);
      window.__forceExpandAll = false;
    };
    document.getElementById("btn-collapse").onclick = function() {
      if (!currentRoot || String(currentRoot).indexOf("browse:") === 0) return;
      window.__forceCollapseAll = true;
      expandState = new Map();
      showItem(currentRoot);
      window.__forceCollapseAll = false;
    };

    async function boot() {
      try {
        const res = await fetch("data.json");
        DATA = await res.json();
        buildIndexes();
        document.getElementById("loading").remove();
        document.getElementById("main").innerHTML =
          '<div class="status">Loaded ' + nameList.length + " items · " + DATA.recipes.length +
          " craft · " + DATA.chemistry.length + " chemistry · " + DATA.distill.length +
          " distill · " + DATA.soup.length + " soups · " + DATA.upgrades.length +
          " upgrades. Type an item. Use ← Back after clicking into ingredients.</div>";
        searchEl.focus();
      } catch (err) {
        document.getElementById("loading").innerHTML =
          '<p style="color:var(--red)">Failed to load data.json: ' + esc(err.message) + "</p>";
      }
    }
    boot();
  </script>
</body>
</html>
